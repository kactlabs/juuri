[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juuri"
version = "0.3.0"
description = "juuri placeholder package"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
networkx = ["networkx"]

[tool.setuptools]
packages = ["juuri"]

[tool.setuptools.package-data]
juuri = ["prompts/*.txt"]
