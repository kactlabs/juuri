[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juuri"
version = "0.0.2"
description = "juuri placeholder package"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["juuri"]

[tool.setuptools.package-data]
juuri = ["prompts/*.txt"]
