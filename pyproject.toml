[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "juuri"
version = "0.4.0"
description = "Knowledge Graphs for RAG. Nothing else."
readme = "README.md"
authors = [{ name = "KactLabs" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["knowledge graph", "rag", "llm", "triples", "ontology"]

[project.urls]
Homepage = "https://github.com/kactlabs/juuri"
Source = "https://github.com/kactlabs/juuri"

[project.optional-dependencies]
networkx = ["networkx"]

[tool.setuptools]
packages = ["juuri"]

[tool.setuptools.package-data]
juuri = ["prompts/*.txt"]
